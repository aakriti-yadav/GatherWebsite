<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Space | Gather</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg glass-navbar fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">🌿 Gather</a>
    <div class="d-flex align-items-center ms-auto gap-2 d-lg-none">
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="study-zones.html">Study Zones</a></li>
        <li class="nav-item"><a class="nav-link" href="booking.html">Book a Space</a></li>
        <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        <li class="nav-item ms-lg-2 mt-2 mt-lg-0 d-none d-lg-block">
          <button id="themeToggleDesktop" class="theme-toggle ms-2" aria-label="Toggle dark mode">🌙</button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div style="height: 80px;"></div>

<main class="fade-in">

  <section class="section">
    <div class="container">
      <h2 class="section-title">Book a Study Space</h2>
      <div class="row g-4">
        <div class="col-lg-7">
          <div class="glass-card">
            <form id="bookingForm" novalidate>
              <div class="mb-3">
                <label class="form-label">Student name</label>
                <input type="text" name="studentName" class="form-control" placeholder="e.g. Bibek Thapa" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Student email</label>
                <input type="email" name="studentEmail" class="form-control"placeholder="e.g. student@university.ac.uk" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Study zone</label>
                <select name="zone" class="form-select" required>
                  <option value="">Choose a zone...</option>
                  <option>Quiet Study Zone</option>
                  <option>Group Study Zone</option>
                  <option>Computer Corner</option>
                  <option>Collaboration Space</option>
                </select>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">Date</label>
                  <!-- min date is set by script.js on page load -->
                  <input type="date" name="date" id="bookingDate" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Time slot</label>
                  <select name="time" class="form-select" required>
                    <option value="">Choose...</option>
                    <option>09:00 - 11:00</option>
                    <option>11:00 - 13:00</option>
                    <option>13:00 - 15:00</option>
                    <option>15:00 - 17:00</option>
                  </select>
                </div>
              </div>
              <button type="submit" class="btn btn-pastel w-100">Confirm Booking</button>
            </form>
          </div>
        </div>
        <div class="col-lg-5">
          <h4>Recent bookings</h4>
          <div id="bookingList"></div>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="glass-footer">
  <div class="container">
    <p class="mb-1">&copy 2026 Gather || Campus Cafe & Study Space</p>
    <small>Built with HTML, CSS, Bootstrap & JavaScript</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
